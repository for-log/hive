services:
  router:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      target: router
    command: ["-config", "/etc/hive/router.yaml"]
    ports:
      - "9000:9000"
      - "8080:8080"
    volumes:
      - ../configs/docker/router.yaml:/etc/hive/router.yaml:ro
      - router-data:/data
      - router-snapshots:/tmp/hive-router-snapshots
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/masters"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 3s

  master-1:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      target: master
    command: ["-config", "/etc/hive/master-1.yaml"]
    volumes:
      - ../configs/docker/master-1.yaml:/etc/hive/master-1.yaml:ro
      - master1-data:/data
      - master1-snapshots:/tmp/hive-snapshots
    depends_on:
      router:
        condition: service_healthy

  master-2:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      target: master
    command: ["-config", "/etc/hive/master-2.yaml"]
    volumes:
      - ../configs/docker/master-2.yaml:/etc/hive/master-2.yaml:ro
      - master2-data:/data
      - master2-snapshots:/tmp/hive-snapshots
    depends_on:
      router:
        condition: service_healthy

  todo-1:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      target: todo
    ports:
      - "8090:8090"
    environment:
      - HIVE_GRPC_ADDR=router:9000
      - HIVE_HTTP_ADDR=router:8080
      - LISTEN_ADDR=:8090
      - LOCAL_DB=/tmp/hive-todo.db
    depends_on:
      router:
        condition: service_healthy
      master-1:
        condition: service_started
      master-2:
        condition: service_started

  todo-2:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      target: todo
    ports:
      - "8091:8091"
    environment:
      - HIVE_GRPC_ADDR=router:9000
      - HIVE_HTTP_ADDR=router:8080
      - LISTEN_ADDR=:8091
      - LOCAL_DB=/tmp/hive-todo.db
    depends_on:
      router:
        condition: service_healthy
      master-1:
        condition: service_started
      master-2:
        condition: service_started

volumes:
  router-data:
  router-snapshots:
  master1-data:
  master1-snapshots:
  master2-data:
  master2-snapshots:
